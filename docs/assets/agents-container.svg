<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d">
<title id="t">Worker and agents container</title>
<desc id="d">The web container (app), the worker and PostgreSQL share the default network; app and worker share the data volume. The worker alone also sits on a second, internal network, shared with the agents container, which runs Claude Code and Codex. The agents container mounts only the CLI logins and, read-only, the key it shares with the worker; it reaches Anthropic and OpenAI through a network of its own. For a run, the worker sends the run with the shared key (1); the CLI calls back the run's tools at the worker's address with a single-use token (2). There is no route from the agents container to app, PostgreSQL or the data volume.</desc>
<style>
  :root { --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --line: #868990; --box: #f6f8fa; --zone: #eef3f9; --zone2: #f3effb; --accent: #3b5bdb; --warn: #b35900; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --line: #6e7681; --box: #161b22; --zone: #12233a; --zone2: #241b36; --accent: #8fa6ff; --warn: #e3a35a; }
  }
  .bg { fill: var(--bg); }
  .zone { fill: var(--zone); stroke: var(--line); stroke-dasharray: 5 4; }
  .zone2 { fill: var(--zone2); fill-opacity: 0.85; stroke: var(--line); stroke-dasharray: 5 4; }
  .box { fill: var(--box); stroke: var(--line); stroke-width: 1.4; }
  .strong { fill: var(--box); stroke: var(--accent); stroke-width: 2; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .title { font-size: 15px; font-weight: 600; }
  .small { font-size: 12px; fill: var(--muted); }
  .net { font-size: 12px; font-weight: 600; fill: var(--muted); }
  .arrow { stroke: var(--line); stroke-width: 1.6; fill: none; }
  .call { stroke: var(--accent); stroke-width: 1.8; fill: none; }
  .no { stroke: var(--warn); stroke-width: 1.6; fill: none; stroke-dasharray: 4 3; }
  .label { font-size: 12px; font-weight: 600; fill: var(--accent); }
  .nolabel { font-size: 12px; fill: var(--warn); }
  .head { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect class="bg" width="900" height="420" rx="12"/>

<!-- Network "default": app, worker, postgres -->
<rect class="zone" x="20" y="36" width="450" height="268" rx="10"/>
<text class="net" x="34" y="58">network "default"</text>
<!-- Network "agents": worker and agents only, without Internet -->
<rect class="zone2" x="440" y="36" width="290" height="268" rx="10"/>
<text class="net" x="560" y="58">network "agents"</text>
<text class="small" x="560" y="74">internal, no Internet</text>

<rect class="box" x="40" y="90" width="160" height="70" rx="8"/>
<text class="title" x="56" y="117">app</text>
<text class="small" x="56" y="136">web, REST API, MCP</text>
<text class="small" x="56" y="151">faces the Internet</text>

<rect class="box" x="300" y="90" width="200" height="86" rx="8"/>
<text class="title" x="316" y="117">worker</text>
<text class="small" x="316" y="136">sync, tidy-up, routines;</text>
<text class="small" x="316" y="151">tool server of a run,</text>
<text class="small" x="316" y="166">for that run only</text>

<rect class="box" x="40" y="214" width="160" height="66" rx="8"/>
<text class="title" x="56" y="241">postgres</text>
<text class="small" x="56" y="260">database</text>

<rect class="box" x="230" y="214" width="180" height="66" rx="8"/>
<text class="title" x="246" y="241">synaptane-data</text>
<text class="small" x="246" y="260">master key, repositories</text>

<path class="arrow" d="M120 160V208"/><path class="head" style="stroke: var(--line)" d="M115 202 120 209 125 202"/>
<path class="arrow" d="M320 176V208"/><path class="head" style="stroke: var(--line)" d="M315 202 320 209 325 202"/>

<rect class="strong" x="580" y="90" width="135" height="98" rx="8"/>
<text class="title" x="596" y="117">agents</text>
<text class="small" x="596" y="136">Claude Code, Codex</text>
<text class="small" x="596" y="151">non-root, read-only,</text>
<text class="small" x="596" y="166">no capability</text>

<rect class="box" x="565" y="214" width="150" height="66" rx="8"/>
<text class="title" x="579" y="238">synaptane-agents</text>
<text class="small" x="579" y="256">CLI logins (HOME)</text>
<text class="small" x="579" y="271">+ shared key, read-only</text>
<path class="arrow" d="M647 188V208"/><path class="head" style="stroke: var(--line)" d="M642 202 647 209 652 202"/>

<!-- 1: the worker sends the run, with the shared key; 2: the CLI calls the run's tools -->
<path class="call" d="M502 112H574"/><path class="head" style="stroke: var(--accent)" d="M568 107 575 112 568 117"/>
<text class="label" x="510" y="104">1. run</text>
<path class="call" d="M578 160H506"/><path class="head" style="stroke: var(--accent)" d="M512 155 505 160 512 165"/>
<text class="label" x="512" y="180">2. tools</text>

<!-- Network "agents-internet": its own, outgoing -->
<rect class="zone" x="750" y="36" width="130" height="268" rx="10"/>
<text class="net" x="760" y="58">"agents-internet"</text>
<rect class="box" x="762" y="100" width="106" height="66" rx="8"/>
<text class="title" x="776" y="127">Anthropic</text>
<text class="title" x="776" y="147">OpenAI</text>
<path class="arrow" d="M717 133H756"/><path class="head" style="stroke: var(--line)" d="M750 128 757 133 750 138"/>

<!-- No route from the agents container to app, postgres or the data volume -->
<path class="no" d="M600 284 C 560 350, 260 350, 150 284"/>
<text class="nolabel" x="230" y="352">no route from agents to app, postgres or the data volume</text>
<text class="small" x="20" y="392">1: with the key shared by the worker and the agents container alone.  2: at the worker's address,</text>
<text class="small" x="20" y="408">with the run's single-use token. Only the worker is on both networks.</text>
</svg>
