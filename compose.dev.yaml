# Development PostgreSQL, with pgvector for hybrid search.
# Start: docker compose -f compose.dev.yaml up -d
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_USER: synaptane
      POSTGRES_PASSWORD: synaptane
      POSTGRES_DB: synaptane
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synaptane"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
