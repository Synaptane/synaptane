# Release publication, on push of a vX.Y.Z tag (or vX.Y.Z-rc.N, pre-release):
#   1. safeguards: tag = pyproject.toml version (in the PEP 440 sense: 1.0.0-rc.1 is
#      1.0.0rc1), commit present on main;
#   2. full CI (ci.yml) on this commit;
#   3. images ghcr.io/synaptane/synaptane and ghcr.io/synaptane/synaptane-nginx (proxy mode),
#      with SBOM, BuildKit provenance and GitHub-signed attestation
#      (`gh attestation verify oci://ghcr.io/synaptane/synaptane:X.Y.Z -R synaptane/synaptane`);
#   4. GitHub Release, notes taken from the `## [X.Y.Z…]` section of CHANGELOG.md;
#   5. documentation of the site (synaptane/website): `repository_dispatch` of type
#      `sync-docs` with this tag, only if the SITE_DISPATCH_TOKEN secret exists (fine-grained
#      token on synaptane/website, Contents: read and write); otherwise the step is skipped;
#   6. Python package (sdist and wheel) on PyPI, by Trusted Publishing (no token stored): the
#      trusted publisher of the `synaptane` project names this workflow and the `pypi`
#      environment.
#
# Run by hand (workflow_dispatch) with an existing tag, it only publishes that tag on PyPI:
# for a release made before the PyPI step existed. Images and GitHub Release are left alone.
#
# Before tagging: version raised in pyproject.toml, Dockerfile (ARG VERSION), compose.yaml
# (SYNAPTANE_VERSION default) and .env.example (CONTRIBUTING.md, maintainer section).
#
# The published image is built without the subscription CLIs (AGENT_CLIS=false): Claude Code
# is a proprietary binary, not redistributable. For subscription mode, build the image.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish on PyPI only (vX.Y.Z or vX.Y.Z-rc.N)"
        required: true
        type: string

permissions: {}

# Only one publication at a time per tag, never cancelled midway.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/synaptane/synaptane
  NGINX_IMAGE: ghcr.io/synaptane/synaptane-nginx

jobs:
  verify:
    name: Safeguards (version, branch)
    # Copies (forks) of the repository publish nothing.
    if: github.repository == 'synaptane/synaptane'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.main.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      pep440: ${{ steps.version.outputs.pep440 }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # By hand: the tag given, never a branch of the same name.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Tag matches pyproject.toml
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          uv run --no-project --with 'packaging>=24' python - <<'EOF'
          import os
          import re
          import sys
          import tomllib

          from packaging.version import InvalidVersion, Version

          tag = os.environ["TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?)", tag)
          if not match:
              sys.exit(f"::error::Tag {tag!r}: expected vX.Y.Z or vX.Y.Z-rc.N")
          semver = match.group(1)
          try:
              tagged = Version(semver)
          except InvalidVersion:
              sys.exit(f"::error::{semver!r} is not a PEP 440 version (alpha, beta, rc)")
          with open("pyproject.toml", "rb") as f:
              declared = Version(tomllib.load(f)["project"]["version"])
          if tagged != declared:
              sys.exit(
                  f"::error::Tag {tag} ({tagged}) differs from pyproject.toml ({declared})"
              )
          if tagged.is_devrelease or tagged.is_postrelease or tagged.local:
              sys.exit(f"::error::{tagged}: no .dev, .post or local version may be published")
          prerelease = "-" in semver
          if prerelease != tagged.is_prerelease:
              sys.exit(f"::error::{semver}: inconsistent pre-release")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\nversion={semver}\npep440={tagged}\n")
              out.write(f"prerelease={str(prerelease).lower()}\n")
          print(f"Version {semver} (PEP 440: {tagged}), pre-release: {prerelease}")
          EOF
      # A tag set on a work branch publishes nothing.
      - name: Commit present on main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${sha}" -q .status)"
          case "$status" in
            identical | behind) echo "Commit ${sha::7} present on main." ;;
            *) echo "::error::Commit ${sha::7} missing from main (${status})."; exit 1 ;;
          esac
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: verify
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Images and GitHub Release
    needs: [verify, ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # GitHub Release
      packages: write # ghcr.io
      id-token: write # Sigstore signature of the attestations
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PEP440: ${{ needs.verify.outputs.pep440 }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags: X.Y.Z and X.Y (a pre-release only gets its own), latest only for a final
      # release.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      # No cache (no possible poisoning, no stale layer) and base images pulled again: the
      # day's Debian fixes go into the release.
      - name: Image Synaptane
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          # VERSION: label org.opencontainers.image.version equal to the image tag (X.Y.Z or
          # X.Y.Z-rc.N), as for the nginx image.
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ env.VERSION }}
            AGENT_CLIS=false
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
      # What was just published starts and carries the right commit (the CI only builds the
      # image with the CLIs); on failure, no attestation and no GitHub Release.
      - name: Published image (version and commit)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint synaptane "${IMAGE}@${DIGEST}" --version | tee "$RUNNER_TEMP/version.txt"
          grep -F "${PEP440} (${GITHUB_SHA::7})" "$RUNNER_TEMP/version.txt"
          label="$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${IMAGE}@${DIGEST}")"
          test "$label" = "$VERSION" || { echo "::error::Label version ${label}, expected ${VERSION}"; exit 1; }
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # would require the artifact-metadata permission

      - name: nginx image tags
        id: meta-nginx
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.NGINX_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Synaptane nginx
            org.opencontainers.image.description=HTTPS reverse proxy for Synaptane (compose.yaml, proxy profile)
      # Context: the root of the repository, for LICENSE, NOTICE and THIRD_PARTY_NOTICES.md
      # (files allowed: deploy/nginx/Dockerfile.dockerignore).
      - name: nginx image (proxy mode)
        id: build-nginx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/nginx/Dockerfile
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.NGINX_IMAGE }}
          subject-digest: ${{ steps.build-nginx.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # Notes: the `## [X.Y.Z…]` section of CHANGELOG.md (Keep a Changelog; brackets and "v"
      # optional, semver or PEP 440 form), up to the next one. Not found: link to the file,
      # followed by notes generated by GitHub.
      - name: Release notes
        id: notes
        env:
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          accepted = {version, os.environ["PEP440"]}  # [1.0.0-rc.1] or [1.0.0rc1]
          changelog = Path("CHANGELOG.md")
          lines = changelog.read_text(encoding="utf-8").splitlines() if changelog.exists() else []
          section, inside = [], False
          for line in lines:
              if line.startswith("## "):
                  if inside:
                      break
                  m = re.match(r"## \[?v?([0-9][^\]\s]*)", line)
                  inside = bool(m) and m.group(1) in accepted
              elif inside:
                  section.append(line)
          # Without the link definitions at the end of the file ([1.0.0]: https://…).
          while section and (not section[-1].strip() or re.match(r"\[[^\]]+\]:\s", section[-1])):
              section.pop()
          body = "\n".join(section).strip()
          found = bool(body)
          if not found:
              repo = os.environ["GITHUB_REPOSITORY"]
              body = f"See [CHANGELOG.md](https://github.com/{repo}/blob/v{version}/CHANGELOG.md)."
          body += f"\n\nImage: `ghcr.io/synaptane/synaptane:{version}`"
          body += f" (`SYNAPTANE_VERSION={version}` in `.env`)."
          Path(os.environ["NOTES"]).write_text(body + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"found={str(found).lower()}\n")
          print(body)
          EOF
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/notes.md
          FOUND: ${{ steps.notes.outputs.found }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$NOTES")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          if [ "$FOUND" != true ]; then args+=(--generate-notes); fi
          gh release create "$TAG" "${args[@]}"

  site:
    name: Site documentation
    needs: [verify, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # Secrets cannot be tested in an `if:`: a first step says whether the token exists.
      - name: SITE_DISPATCH_TOKEN present?
        id: token
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No SITE_DISPATCH_TOKEN secret: the site documentation is not synced (run sync-docs by hand on synaptane/website)."
          fi
      - name: repository_dispatch sync-docs to synaptane/website
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh api --method POST repos/synaptane/website/dispatches \
            -f event_type=sync-docs -f "client_payload[ref]=${TAG}" -f "client_payload[version]=${VERSION}"
          echo "sync-docs requested on synaptane/website for ${TAG}."

  pypi-build:
    name: Python package
    needs: [verify, release]
    # On a tag push, after the images and the GitHub Release; by hand, right after the
    # safeguards (the tag already went through the CI when it was released).
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' && (needs.release.result == 'success'
      || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      PEP440: ${{ needs.verify.outputs.pep440 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # PyPI shows the README without the repository around it: relative links and images
      # point to GitHub, at this tag.
      - name: README links for PyPI
        run: |
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path

          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
          tag = os.environ["TAG"]
          raw = f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{tag}/"
          blob = f"{base}/blob/{tag}/"


          def absolute(url: str, prefix: str) -> str:
              if re.match(r"[a-z][a-z0-9+.-]*:|#|/", url):
                  return url
              return prefix + url


          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = re.sub(r'(<img\s[^>]*src=")([^"]+)"', lambda m: m[1] + absolute(m[2], raw) + '"', text)
          text = re.sub(r"(!\[[^\]]*\]\()([^)\s]+)", lambda m: m[1] + absolute(m[2], raw), text)
          text = re.sub(r'(<a\s[^>]*href=")([^"]+)"', lambda m: m[1] + absolute(m[2], blob) + '"', text)
          # Links last: images are already absolute, a badge's link ([![…](…)](LICENSE)) too.
          text = re.sub(r"(\]\()([^)\s]+)", lambda m: m[1] + absolute(m[2], blob), text)
          text = re.sub(r"^(\[[^\]]+\]:\s+)(\S+)", lambda m: m[1] + absolute(m[2], blob), text, flags=re.M)
          readme.write_text(text, encoding="utf-8")
          EOF
          git diff --stat
      - name: sdist and wheel
        run: |
          uv build --out-dir dist
          ls -l dist
          test -f "dist/synaptane-${PEP440}.tar.gz"
          test -f "dist/synaptane-${PEP440}-py3-none-any.whl"
          uvx --from 'twine>=6' twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: PyPI
    needs: [verify, pypi-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The trusted publisher on PyPI names this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/synaptane/${{ needs.verify.outputs.pep440 }}/
    permissions:
      id-token: write # Trusted Publishing (OIDC), no token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
