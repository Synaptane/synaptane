# Site for the nginx already installed on the server (default mode of compose.yaml:
# Synaptane listens on 127.0.0.1:8000). This is the configuration running in production.
#
# Installation (site, Let's Encrypt certificate, reload): rather than copying this
# file, run
#   sudo deploy/host/install-nginx.sh brain.example.com
# which replaces the domain, the port and the ACME challenge folder, and obtains the
# certificate before enabling the HTTPS block (nginx refuses a certificate that does not exist yet).
#
# Values replaced by install-nginx.sh: brain.example.com, 127.0.0.1:8000 and
# /var/www/letsencrypt.

# HTTP: certbot ACME challenge (renewal), everything else redirected to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name brain.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://brain.example.com$request_uri;
    }
}
# --- end of HTTP block (install-nginx.sh only installs what precedes before the certificate)

# Log without secrets: link tokens (invitation, forgotten password, e-mail verification)
# masked, and without query parameters.
map $uri $synaptane_logged_uri {
    ~^(?<synaptane_prefix>/(reset|invite|verify-email)/)  "${synaptane_prefix}…";
    default                                               $uri;
}
log_format synaptane '$remote_addr - [$time_iso8601] "$request_method $synaptane_logged_uri" '
                     '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 443 ssl;
    server_name brain.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/brain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brain.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # HTTPS only, for one year: the browser never tries HTTP again.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/synaptane.access.log synaptane;

    # Attachments and uploaded files: 25 MB each, several per upload.
    client_max_body_size 100m;

    # Compression of static files and JSON. Not HTML: it contains CSRF tokens next to
    # user-entered text (BREACH attack).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # real address, cannot be spoofed
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;          # streamed MCP
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
